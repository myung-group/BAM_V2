[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BAM_V2"
version = "0.2.0"
description = "Uncertainty Quantification of Bayesian Deep Learning ab initio Potential"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Chang Woo Myung", email = "cwmyung@skku.edu"},
    {name = "Soohaeng Yoo Willow", email = "sy7willow@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "ase>=3.24.0",
    "matscipy>=1.2.0",
    "numpy>=2.2.6",
    "tqdm>=4.67.1",
    "natsort>=8.0.0",
]

[project.optional-dependencies]
# JAX backend: race_v2 (old import name bam_omat24: compatibility aliases in bam_omat24/)
jax = [
    "jax>=0.8.2",
    "jaxlib>=0.8.2",
    "flax>=0.12.0",
    "optax>=0.2.4",
    "e3nn-jax>=0.20.7",
    "jraph>=0.0.6.dev0",
]
# PyTorch (race_v2_torch/ is its own project folder: PYTHONPATH=<repo>/race_v2_torch)
torch = [
    "torch>=2.10.0",
    "e3nn>=0.5.0",
]
# PyTorch backend with cuequivariance (CUDA-optimized): bam_torch_cue
torch-cue = [
    "torch>=2.10.0",
    "cuequivariance>=0.9.0",
    "cuequivariance-torch>=0.9.0",
    "einops>=0.7.0",
]
# Install everything
all = [
    "jax>=0.8.2",
    "jaxlib>=0.8.2",
    "flax>=0.12.0",
    "optax>=0.2.4",
    "e3nn-jax>=0.20.7",
    "jraph>=0.0.6.dev0",
    "torch>=2.10.0",
    "e3nn>=0.5.0",
    "einops>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/myung-group/BAM_V2"
Repository = "https://github.com/myung-group/BAM_V2"

# Packages listed explicitly (2026-11-24): race_v2_torch lives in race_v2_torch/race_v2_torch (its own project folder),
# and the mapping below installs it as the top-level package race_v2_torch, so that `from race_v2_torch.calculator
# import RACEv2Calculator` works in a pip install as it does with PYTHONPATH=<repo>/race_v2_torch.  (The previous
# packages.find installed it as race_v2_torch.race_v2_torch, plus race_v2_torch/tests and tools.)  Add a new
# subpackage of race_v2 here.
[tool.setuptools]
packages = [
    "bam_omat24",
    "race_v2",
    "race_v2.data",
    "race_v2.eval",
    "race_v2.export",
    "race_v2.inference",
    "race_v2.models",
    "race_v2.training",
    "race_v2_torch",
]

[tool.setuptools.package-dir]
race_v2_torch = "race_v2_torch/race_v2_torch"

# Data files read at run time: the core exclusion table of the ASE calculators' default (race_v2/resources) and the
# element tables of the PyTorch port.
[tool.setuptools.package-data]
race_v2 = ["models/atomic_shells.json", "resources/*.json"]
race_v2_torch = ["data/*.json"]

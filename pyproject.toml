[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BAM-nequip"
version = "0.1.0.dev0"
description = "Uncertainty Quantification of Bayesian Deep Learning ab initio Potential"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Chang Woo Myung", email = "cwmyung@skku.edu"},
    {name = "Soohaeng Yoo Willow", email = "sy7willow@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.8.2",
    "jaxlib>=0.8.2",
    "flax>=0.12.0",
    "optax>=0.2.4",
    "e3nn-jax>=0.20.7",
    "jraph>=0.0.6.dev0",
    "ase>=3.24.0",
    "matscipy>=1.2.0",
    "numpy>=2.2.6",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/myung-group/BAM-nequip"
Repository = "https://github.com/myung-group/BAM-nequip"

[tool.setuptools.packages.find]
include = ["bam_3bpa*", "bam_omat24*"]
